<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Artisan Table | Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#ffdbd1",
                        "primary": "#994127",
                        "primary-container": "#b8583d",
                        "on-primary": "#ffffff",
                        "surface-bright": "#fbf9f5",
                        "on-surface": "#1b1c1a",
                        "on-surface-variant": "#56423d",
                        "outline-variant": "#dcc1ba",
                        "outline": "#89726c",
                        "secondary": "#496455"
                    },
                    "fontFamily": {
                        "headline-lg": ["Newsreader"],
                        "headline-lg-mobile": ["Newsreader"],
                        "headline-md": ["Newsreader"],
                        "body-md": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "label-md": ["Manrope"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1b1c1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCDc4LesgwtZ8GjJm4X3vJ_YE0DOCru6N2P5PpKzUtiv2t8kzhQWD4Cp5p7iNGORKl88B6Z4ksmwjMZ37c7cLYYNYXuJlEDNZJe7n7X1xXBhYfaxnXuctA1XBsUWszMPc-kJQZvMTSN86W8xQzlNRagGxJAnG57qHg4OYbI6hfTV7F-QEQU87IhB0dM2kk7N2G72zZXZGtKUHOtCwT1TJEf82jwdKGxbe4TFKhD7V1wxTPTNDnsCd5vvW480VgdCWdrnFqfmn1a403-');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.6);
            z-index: -1;
            transform: scale(1.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(251, 249, 245, 0.90);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(220, 193, 186, 0.3);
        }
        .input-focus-effect:focus-within {
            border-color: #994127;
            box-shadow: 0 0 0 1px #994127;
        }
    </style>
</head>
<body class="font-body-md text-on-surface p-4 md:p-0">
    <div class="bg-image"></div>
    
    <div class="fixed top-0 left-0 w-full p-6 flex items-center justify-center z-20">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-white text-[24px] drop-shadow-md">restaurant</span>
            <span class="font-headline-lg text-white tracking-tight drop-shadow-md text-[28px]">Artisan Table</span>
        </div>
    </div>

    <main class="w-full max-w-[460px] z-10 my-20">
        <div class="glass-card rounded-xl p-6 md:p-10 animate-in fade-in zoom-in-95 duration-700">
            <div class="text-center mb-8">
                <h1 class="font-headline-lg-mobile md:font-headline-lg text-on-surface mb-2">Join the Menu</h1>
                <p class="text-on-surface-variant font-body-md px-6">Register a new account to access the login portal.</p>
            </div>

            <form id="registerForm" class="space-y-5">
                
                <div class="space-y-1">
                    <label class="font-label-sm text-on-surface-variant uppercase tracking-wider text-[12px] font-bold">Full Name</label>
                    <div class="relative flex items-center transition-all duration-200 bg-surface-bright/50 border border-outline-variant rounded-lg px-4 py-3 input-focus-effect">
                        <span class="material-symbols-outlined text-on-surface-variant mr-3">person</span>
                        <input type="text" id="fullname" class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-md outline-none" placeholder="Chef Vikram" required>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="font-label-sm text-on-surface-variant uppercase tracking-wider text-[12px] font-bold">Phone Number</label>
                    <div class="relative flex items-center transition-all duration-200 bg-surface-bright/50 border border-outline-variant rounded-lg px-4 py-3 input-focus-effect">
                        <span class="material-symbols-outlined text-on-surface-variant mr-3">call</span>
                        <input type="tel" id="phone" class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-md outline-none" placeholder="+91 98765 43210" required>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="font-label-sm text-on-surface-variant uppercase tracking-wider text-[12px] font-bold">Email</label>
                    <div class="relative flex items-center transition-all duration-200 bg-surface-bright/50 border border-outline-variant rounded-lg px-4 py-3 input-focus-effect">
                        <span class="material-symbols-outlined text-on-surface-variant mr-3">mail</span>
                        <input type="email" id="email" class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-md outline-none" placeholder="chef@artisantable.in" required>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="font-label-sm text-on-surface-variant uppercase tracking-wider text-[12px] font-bold">Password</label>
                    <div class="relative flex items-center transition-all duration-200 bg-surface-bright/50 border border-outline-variant rounded-lg px-4 py-3 input-focus-effect">
                        <span class="material-symbols-outlined text-on-surface-variant mr-3">lock</span>
                        <input type="password" id="password" class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-md outline-none" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-[#994127] text-white font-bold py-3 rounded-lg shadow-md hover:bg-[#b8583d] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-8">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="mt-8 text-center border-t border-outline-variant pt-6">
                <p class="font-label-md text-on-surface-variant text-[14px]">
                    Already have an account? 
                    <a href="../login/code.html" class="text-[#496455] font-bold hover:underline underline-offset-4 ml-1">Log in</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span><span>Registering...</span>';
            btn.disabled = true;

            const fullname = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, phone, email, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert("Account created successfully! Please log in.");
                    window.location.href = '../login/code.html';
                } else {
                    alert(data.error || "Failed to register.");
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert("Server error. Make sure your backend is running.");
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
