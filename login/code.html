<body class="font-body-md text-on-surface p-margin-mobile md:p-0">
<div class="bg-image"></div>
<!-- Top Branding -->
<div class="fixed top-0 left-0 w-full p-md flex items-center justify-center z-20">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-white text-headline-md drop-shadow-md" data-icon="restaurant">restaurant</span>
<span class="font-headline-lg text-white tracking-tight drop-shadow-md">Artisan Table</span>
</div>
</div>
<main class="w-full max-w-[460px] z-10 my-xl">
<!-- Main Login Card -->
<div class="glass-card rounded-xl p-md md:p-lg animate-in fade-in zoom-in-95 duration-700">
<!-- Greeting Header -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-fixed mb-md">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">skillet</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-on-surface mb-xs">Namaste!</h1>
<p class="text-on-surface-variant font-body-md px-md">Welcome back to your Restaurant. Ready for today?</p>
</div>
<!-- Login Form -->
<form class="space-y-md" id="loginForm" onsubmit="return false">
<!-- Full Name Field -->
<div class="space-y-xs">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider" for="fullname">Full Name</label>
<div class="relative flex items-center transition-all duration-200 bg-surface-bright/50 border border-outline-variant rounded-lg px-md py-sm input-focus-effect">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="person">person</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-md" id="fullname" name="fullname" placeholder="Ninganna" required="" type="text"/>
</div>
</div>
<!-- Phone Number Field -->
<div class="space-y-xs">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider" for="phone">Phone Number</label>
<div class="relative flex items-center transition-all duration-200 bg-surface-bright/50 border border-outline-variant rounded-lg px-md py-sm input-focus-effect">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="call">call</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-md" id="phone" name="phone" placeholder="+91 98765 43210" required="" type="tel"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
<div class="relative flex items-center transition-all duration-200 bg-surface-bright/50 border border-outline-variant rounded-lg px-md py-sm input-focus-effect">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-md" id="email" name="email" placeholder="chef@artisantable.in" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-primary hover:text-primary-container transition-colors underline underline-offset-4 decoration-primary/30" href="#">Forgot?</a>
</div>
<div class="relative flex items-center transition-all duration-200 bg-surface-bright/50 border border-outline-variant rounded-lg px-md py-sm input-focus-effect">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/50 font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm pt-xs">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-low" id="remember" type="checkbox"/>
<label class="font-label-md text-on-surface-variant cursor-pointer select-none" for="remember">Keep me signed in </label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-label-md py-md rounded-lg shadow-md hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-lg" type="submit">
<span>Start </span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Action -->
<div class="mt-xl text-center border-t border-outline-variant pt-md">
<p class="font-label-md text-on-surface-variant">
<a class="text-secondary font-bold hover:underline underline-offset-4 ml-xs" href="../register/code.html">Register </a>
</p>
</div>
</div>
<!-- Atmospheric Footer -->
<div class="mt-md flex justify-center gap-lg text-white opacity-80 drop-shadow-sm">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="verified_user">verified_user</span>
<span class="font-label-sm">Secure Entry</span>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="support_agent">support_agent</span>
<span class="font-label-sm">Staff Support</span>
</div>
</div>
</main>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const fullname = document.getElementById('fullname').value; // if using for registration
        
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem('token', data.token);
                alert("Namaste! Successfully authenticated.");
                window.location.href = '/menu/code.html';
            } else {
                alert(data.error);
            }
        } catch (err) {
            console.error(err);
        }
    });
</script>
</body></html>
